spring:
  application:
    name: rsvpservice
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:turnout_db}?currentSchema=guests
    username: ${DB_USER:turnout}
    password: ${DB_PASSWORD:turnout}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: guests
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info

turnout:
  rsvp:
    lock-ttl-seconds: 5
    rate-limit-per-minute: 10
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-here-change-in-production}
  services:
    event-service-url: ${EVENT_SERVICE_URL:http://localhost:8083}
