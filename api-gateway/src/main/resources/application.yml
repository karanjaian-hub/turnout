server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-public
          uri: http://${AUTH_SERVICE_HOST:authservice}:8081
          predicates:
            - Path=/api/auth/**

        - id: rsvp-public
          uri: http://${RSVP_SERVICE_HOST:rsvpservice}:8085
          predicates:
            - Path=/api/rsvp/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        - id: payments-webhooks-public
          uri: http://${PAYMENT_SERVICE_HOST:paymentservice}:8087
          predicates:
            - Path=/api/payments/mpesa/callback, /api/payments/stripe/webhook

        - id: websocket
          uri: ws://${NOTIFICATION_SERVICE_HOST:notificationservice}:8086
          predicates:
            - Path=/ws/**

        - id: events
          uri: http://${EVENT_SERVICE_HOST:eventservice}:8082
          predicates:
            - Path=/api/events/**
          filters:
            - JwtAuthFilter

        - id: guests
          uri: http://${GUEST_SERVICE_HOST:guestservice}:8083
          predicates:
            - Path=/api/guests/**
          filters:
            - JwtAuthFilter

        - id: emails
          uri: http://${EMAIL_SERVICE_HOST:emailservice}:8084
          predicates:
            - Path=/api/emails/**
          filters:
            - JwtAuthFilter

        - id: admin
          uri: http://${NOTIFICATION_SERVICE_HOST:notificationservice}:8086
          predicates:
            - Path=/api/admin/**
          filters:
            - JwtAuthFilter

        - id: payments
          uri: http://${PAYMENT_SERVICE_HOST:paymentservice}:8087
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthFilter

        - id: ai
          uri: http://${AI_SERVICE_HOST:aiservice}:8088
          predicates:
            - Path=/api/ai/**
          filters:
            - JwtAuthFilter

turnout:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

