spring:
  application:
    name: emailservice
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:turnout_db}?currentSchema=email
    username: ${DB_USERNAME:turnout_user}
    password: ${DB_PASSWORD:turnout_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: email
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: emailservice-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8084

brevo:
  api:
    key: ${BREVO_API_KEY:your-brevo-api-key-here}
    base-url: https://api.brevo.com/v3
  sender:
    email: ${BREVO_SENDER_EMAIL:no-reply@turnout.com}
    name: ${BREVO_SENDER_NAME:Turnout}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.turnout.emailservice: DEBUG
