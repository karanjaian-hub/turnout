    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      SERVER_PORT: 8086
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - turnout-network

  paymentservice:
    build:
      context: .
      dockerfile: services/paymentservice/Dockerfile
      args:
        SERVICE_PATH: services/paymentservice
    container_name: turnout_paymentservice
    restart: unless-stopped
