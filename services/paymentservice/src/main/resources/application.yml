spring:
  application:
    name: paymentservice

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/turnout?currentSchema=payment
    username: ${DB_USERNAME:turnout}
    password: ${DB_PASSWORD:turnout}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# M-Pesa Daraja API — values come from Safaricom developer portal, rotate per environment
turnout:
  mpesa:
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    shortcode: ${MPESA_SHORTCODE:174379}
    passkey: ${MPESA_PASSKEY}
    callback-url: ${MPESA_CALLBACK_URL}
    env: ${MPESA_ENV:sandbox}
    api-base-url: https://sandbox.safaricom.co.ke

  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  jwt:
    secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: localhost
  datasource:
    url: jdbc:postgresql://localhost:5432/turnout?currentSchema=payment
