spring:
  application:
    name: emailservice

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:turnout_email}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: emailservice-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # We deserialize as plain String and parse JSON manually in the consumer
      # This avoids tying us to a specific deserializer class at the Kafka level

server:
  port: 8084

brevo:
  api:
    key: ${BREVO_API_KEY:your-brevo-api-key-here}
    base-url: https://api.brevo.com/v3
  sender:
    email: ${BREVO_SENDER_EMAIL:no-reply@turnout.com}
    name: ${BREVO_SENDER_NAME:Turnout}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.turnout.emailservice: DEBUG
