[versions]
agp                     = "8.5.0"
kotlin                  = "2.0.0"
ksp                     = "2.0.0-1.0.22"
hilt                    = "2.51.1"
compose-bom             = "2024.04.00"
navigation-compose      = "2.7.7"
lifecycle               = "2.7.0"
activity-compose        = "1.9.0"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
coroutines              = "1.8.0"
datastore               = "1.1.1"
security-crypto         = "1.1.0-alpha06"
krossbow                = "7.1.0"
vico                    = "1.15.0"
coil                    = "2.7.0"
firebase-bom            = "33.1.0"
firebase-appdistribution = "5.0.0"
biometric               = "1.2.0-alpha05"
room                    = "2.6.1"
work                    = "2.9.0"
core-splashscreen       = "1.0.1"
material-components     = "1.12.0"
window-sizeclass         = "1.2.1"
accompanist             = "0.34.0"
hilt-navigation-compose = "1.2.0"

[libraries]
# Compose
compose-bom                   = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3             = { group = "androidx.compose.material3", name = "material3" }
compose-ui                    = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest      = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-animation             = { group = "androidx.compose.animation", name = "animation" }
compose-material-m2            = { group = "androidx.compose.material", name = "material" }
activity-compose              = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
navigation-compose            = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Lifecycle
lifecycle-viewmodel-compose   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Hilt
hilt-android                  = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                 = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose       = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Network
retrofit                      = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson                 = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp                        = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging                = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Coroutines
coroutines-android            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Storage
datastore-preferences         = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
security-crypto               = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# WebSocket
krossbow-stomp-core           = { group = "org.hildan.krossbow", name = "krossbow-stomp-core", version.ref = "krossbow" }
krossbow-websocket-okhttp     = { group = "org.hildan.krossbow", name = "krossbow-websocket-okhttp", version.ref = "krossbow" }

# Charts
vico-compose                  = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3               = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Image loading
coil-compose                  = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Firebase
firebase-bom                  = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-messaging             = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Biometric
biometric                     = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Room
room-runtime                  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                      = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler                 = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# WorkManager
work-runtime                  = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
core-splashscreen             = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
material-components           = { group = "com.google.android.material", name = "material", version.ref = "material-components" }
window-sizeclass               = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "window-sizeclass" }

# Accompanist
accompanist-permissions       = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# Testing
junit                         = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit                = { group = "androidx.test.ext", name = "junit", version = "1.1.5" }
espresso-core                 = { group = "androidx.test.espresso", name = "espresso-core", version = "3.5.1" }
compose-ui-test-junit4        = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services      = { id = "com.google.gms.google-services", version = "4.4.2" }
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "firebase-appdistribution" }
