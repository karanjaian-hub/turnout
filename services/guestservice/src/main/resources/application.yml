spring:
  application:
    name: guestservice
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:turnout_db}?currentSchema=guests
    username: ${DB_USERNAME:turnout}
    password: ${DB_PASSWORD:turnout}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: guests
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    schemas: guests
    locations: classpath:db/migration
    baseline-on-migrate: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

turnout:
  guest:
    token-expiry-days: 30
    batch-size: 500
  jwt:
    secret: ${JWT_SECRET}
  event-service:
    url: ${EVENT_SERVICE_URL:http://eventservice:8082}
